name: "🐛 Bug Report"
description: Report something that is broken or not working correctly
title: "[BUG] "
labels:
  - bug
  - needs-triage

body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgently does this need to be resolved?
      options:
        - "🔴 Critical — Production down / major business impact"
        - "🟠 High — Major functionality broken"
        - "🟡 Medium — Functionality impaired but workaround exists"
        - "🟢 Low — Minor issue / cosmetic"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe what is going wrong.
      placeholder: Explain the issue clearly...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the problem.
      placeholder: |
        1. Go to...
        2. Click...
        3. Enter...
        4. Error occurs...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page / URL
      description: Where does the issue occur?
      placeholder: https://...

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Development / Local
        - Unknown
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: Drag and drop screenshots or recordings here.

  - type: textarea
    id: technical
    attributes:
      label: Technical Details
      description: Include console errors, logs, API errors or other useful technical information.

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Anything else relevant to this issue?